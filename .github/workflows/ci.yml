# CI (M21) — runs on every push / PR.
#
# The integration gate uses an EMBEDDED Postgres (pgserver, with pgvector), so no
# external service container is needed — the gate spins up its own DB per run.
# Jobs: ruff lint, the embedded-Postgres integration gate, the unit suite, a
# dashboard JS syntax check, and `php -l` on the WordPress plugin.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint (ruff)
        run: uv run --python 3.12 --with ruff ruff check admin_ai_platform _gate_runner.py

      - name: Integration gate (embedded Postgres + pgvector)
        run: >
          uv run --python 3.12
          --with pgserver --with pytest --with python-pptx
          --with cryptography --with rjsmin
          python _gate_runner.py

      - name: Unit suite
        run: >
          uv run --python 3.12
          --with psycopg2-binary --with pytest --with flask --with openai
          --with cryptography --with python-pptx --with rjsmin
          python -m pytest admin_ai_platform/tests -q

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dashboard inline-JS syntax check
        run: |
          node -e '
            const fs=require("fs");
            const html=fs.readFileSync("admin_ai_platform/admin/dashboard.html","utf8");
            const m=html.match(/<script[^>]*>([\s\S]*)<\/script>/);
            if(!m){console.error("no script block");process.exit(1);}
            new Function(m[1]);
            console.log("dashboard JS syntax OK");
          '

      - name: Loader + widget JS syntax check
        run: |
          for f in embed/loader.js admin_ai_platform/web/chat-ui.js admin_ai_platform/web/voice.js; do
            node --check "$f" && echo "ok: $f"
          done

  wordpress-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: php -l the plugin
        run: |
          for f in $(find wordpress-plugin -name '*.php'); do
            php -l "$f"
          done
