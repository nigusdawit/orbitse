<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Concierge — Admin</title>
  <!--
    M2 admin dashboard shell. Tabs wired to the DB-verified admin APIs:
    Admin Chat (streaming + approve/reject), Chatbot, Provider, Chat History,
    Pages. Same-origin: the session cookie authenticates every /admin/api call.
    More tabs (Cost, Skills, MCP, RAG, Automations, ...) accrue in later
    milestones. Browser interaction is a manual check; the endpoints it calls
    are all gate-verified.
  -->
  <style>
    :root { --accent:#c9a96e; --bg:#0a0f1a; --panel:rgba(20,20,24,.78);
            --border:rgba(255,255,255,.12); --text:#e8e8ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'DM Sans',system-ui,sans-serif; background:var(--bg);
           color:var(--text); display:flex; min-height:100vh; }
    nav { width:200px; flex:0 0 200px; background:var(--panel); border-right:1px solid var(--border);
          padding:18px 10px; }
    nav h1 { font-family:'Playfair Display',Georgia,serif; font-size:16px; padding:0 8px 12px; }
    nav button { display:block; width:100%; text-align:left; background:none; border:none;
                 color:var(--text); padding:9px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
    nav button.active, nav button:hover { background:rgba(255,255,255,.07); }
    nav .logout { margin-top:20px; color:#bbb; font-size:13px; }
    main { flex:1; padding:24px 28px; overflow:auto; }
    h2 { font-family:'Playfair Display',Georgia,serif; color:var(--accent); margin-top:0; }
    .tab { display:none; } .tab.active { display:block; }
    label { display:block; margin:10px 0 4px; font-size:13px; opacity:.8; }
    input, textarea, select { width:100%; padding:9px 11px; border-radius:8px;
      border:1px solid var(--border); background:rgba(255,255,255,.05); color:var(--text); outline:none; }
    textarea { min-height:120px; font-family:inherit; }
    button.act { background:var(--accent); color:#1a1a1a; border:none; border-radius:8px;
                 padding:9px 16px; font-weight:600; cursor:pointer; margin-top:12px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; } .row > div { flex:1; min-width:200px; }
    table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
    td, th { border:1px solid var(--border); padding:7px 9px; text-align:left; }
    .msg { padding:9px 12px; border-radius:10px; margin:8px 0; max-width:80%; white-space:pre-wrap; }
    .msg.user { background:var(--accent); color:#1a1a1a; margin-left:auto; }
    .msg.assistant { background:rgba(255,255,255,.06); border:1px solid var(--border); }
    .pending { border:1px solid var(--accent); border-radius:10px; padding:10px; margin:8px 0; }
    .pending button { margin-right:8px; }
    #chatlog { height:48vh; overflow:auto; border:1px solid var(--border); border-radius:10px;
               padding:12px; margin-bottom:10px; }
    .muted { opacity:.6; font-size:13px; }
  </style>
</head>
<body>
  <nav>
    <h1>AI Concierge</h1>
    <button data-tab="chat" class="active">Admin Chat</button>
    <button data-tab="chatbot">Chatbot</button>
    <button data-tab="provider">AI Provider</button>
    <button data-tab="history">Chat History</button>
    <button data-tab="pages">Saved Pages</button>
    <div class="logout"><a href="/admin/logout" style="color:#bbb">Log out</a></div>
  </nav>
  <main>
    <!-- Admin Chat -->
    <section class="tab active" id="tab-chat">
      <h2>Admin Chat</h2>
      <p class="muted">Ask about your data, or propose changes (writes need your approval).</p>
      <div id="chatlog"></div>
      <div style="display:flex; gap:8px;">
        <input id="chatinput" placeholder="e.g. how many gallery cards do I have?" />
        <button class="act" style="margin:0" onclick="sendChat()">Send</button>
      </div>
    </section>

    <!-- Chatbot settings -->
    <section class="tab" id="tab-chatbot">
      <h2>Chatbot</h2>
      <div class="row">
        <div><label>Agent name</label><input id="cb_name"></div>
        <div><label>Agent role</label><input id="cb_role"></div>
      </div>
      <label>Greeting</label><input id="cb_greeting">
      <label><input type="checkbox" id="cb_enabled" style="width:auto"> Enabled on site</label>
      <label>System prompt (blank = built-in default)</label>
      <textarea id="cb_prompt"></textarea>
      <button class="act" onclick="saveChatbot()">Save chatbot settings</button>
      <span id="cb_status" class="muted"></span>
    </section>

    <!-- Provider -->
    <section class="tab" id="tab-provider">
      <h2>AI Provider</h2>
      <div class="row">
        <div><label>Provider</label>
          <select id="pv_provider"><option value="openai">OpenAI</option><option value="claude">Claude</option></select></div>
        <div><label>OpenAI model</label><input id="pv_openai"></div>
        <div><label>Claude model</label><input id="pv_claude"></div>
      </div>
      <button class="act" onclick="saveProvider()">Save provider</button>
      <span id="pv_status" class="muted"></span>
    </section>

    <!-- Chat History -->
    <section class="tab" id="tab-history">
      <h2>Chat History</h2>
      <div id="hist_stats" class="muted"></div>
      <table id="hist_table"><thead><tr><th>When</th><th>Messages</th><th>First message</th></tr></thead><tbody></tbody></table>
    </section>

    <!-- Pages -->
    <section class="tab" id="tab-pages">
      <h2>Saved Pages</h2>
      <table id="pages_table"><thead><tr><th>Title</th><th>Slug</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
    </section>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    async function getJSON(u){ const r = await fetch(u); return r.ok ? r.json() : null; }
    async function send(u, method, body){
      const r = await fetch(u, {method, headers:{'Content-Type':'application/json'},
        body: body ? JSON.stringify(body) : undefined});
      return r.ok ? r.json() : null;
    }

    // Tab switching
    document.querySelectorAll('nav button[data-tab]').forEach(b => b.onclick = () => {
      document.querySelectorAll('nav button[data-tab]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      $('#tab-' + b.dataset.tab).classList.add('active');
      if (b.dataset.tab === 'chatbot') loadChatbot();
      if (b.dataset.tab === 'provider') loadProvider();
      if (b.dataset.tab === 'history') loadHistory();
      if (b.dataset.tab === 'pages') loadPages();
    });

    // ---- Admin chat (SSE) ----
    const SESSION = 'admin_' + Math.random().toString(36).slice(2);
    function addMsg(role, text){ const d=document.createElement('div'); d.className='msg '+role;
      d.textContent=text; $('#chatlog').appendChild(d); $('#chatlog').scrollTop=1e9; return d; }
    function addPending(actionId, preview){
      const d=document.createElement('div'); d.className='pending';
      d.innerHTML='<div>'+preview.replace(/</g,'&lt;')+'</div>';
      const ap=document.createElement('button'); ap.className='act'; ap.textContent='Approve';
      const rj=document.createElement('button'); rj.textContent='Reject';
      ap.onclick=async()=>{ await send('/admin/api/chat/action/'+actionId+'/approve','POST'); d.innerHTML='<span class="muted">Approved.</span>'; };
      rj.onclick=async()=>{ await send('/admin/api/chat/action/'+actionId+'/reject','POST'); d.innerHTML='<span class="muted">Rejected.</span>'; };
      d.appendChild(ap); d.appendChild(rj); $('#chatlog').appendChild(d); $('#chatlog').scrollTop=1e9;
    }
    async function sendChat(){
      const text = $('#chatinput').value.trim(); if(!text) return;
      $('#chatinput').value=''; addMsg('user', text);
      const bubble = addMsg('assistant','');
      const resp = await fetch('/admin/api/chat/stream', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message:text, session_id:SESSION})});
      const reader = resp.body.getReader(); const dec=new TextDecoder(); let buf='', acc='';
      while(true){ const {done,value}=await reader.read(); if(done) break;
        buf += dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
        for(const line of lines){ if(line.indexOf('data:')!==0) continue;
          let ev; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
          if(ev.type==='token'){ acc+=ev.content; bubble.textContent=acc; $('#chatlog').scrollTop=1e9; }
          else if(ev.type==='text'){ acc=ev.content; bubble.textContent=acc; }
          else if(ev.type==='pending_action'){ addPending(ev.action_id, ev.preview); }
          else if(ev.type==='error'){ bubble.textContent=ev.content; }
        }
      }
    }
    $('#chatinput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });

    // ---- Chatbot ----
    async function loadChatbot(){ const s=await getJSON('/admin/api/chatbot-settings')||{};
      $('#cb_name').value=s.agent_name||''; $('#cb_role').value=s.agent_role||'';
      $('#cb_greeting').value=s.greeting||''; $('#cb_enabled').checked=!!s.enabled;
      $('#cb_prompt').value=s.system_prompt||''; }
    async function saveChatbot(){ await send('/admin/api/chatbot-settings','PUT',{
      agent_name:$('#cb_name').value, agent_role:$('#cb_role').value, greeting:$('#cb_greeting').value,
      enabled:$('#cb_enabled').checked, system_prompt:$('#cb_prompt').value, mode:'builtin'});
      $('#cb_status').textContent='Saved.'; setTimeout(()=>$('#cb_status').textContent='',2000); }

    // ---- Provider ----
    async function loadProvider(){ const p=await getJSON('/admin/api/llm-provider')||{};
      $('#pv_provider').value=p.provider||'openai'; $('#pv_openai').value=p.openai_model||'';
      $('#pv_claude').value=p.claude_model||''; }
    async function saveProvider(){ await send('/admin/api/llm-provider','PUT',{
      provider:$('#pv_provider').value, openai_model:$('#pv_openai').value, claude_model:$('#pv_claude').value});
      $('#pv_status').textContent='Saved.'; setTimeout(()=>$('#pv_status').textContent='',2000); }

    // ---- History ----
    async function loadHistory(){ const d=await getJSON('/admin/api/chat-history')||{conversations:[],stats:{}};
      $('#hist_stats').textContent = (d.stats.total_conversations||0)+' conversations · '+
        (d.stats.messages_today||0)+' messages today · '+(d.stats.unique_visitors||0)+' visitors';
      const tb=$('#hist_table tbody'); tb.innerHTML='';
      (d.conversations||[]).forEach(c=>{ const tr=document.createElement('tr');
        tr.innerHTML='<td>'+(c.updated_at||'')+'</td><td>'+(c.message_count||0)+
          '</td><td>'+((c.first_message||'').slice(0,80))+'</td>'; tb.appendChild(tr); }); }

    // ---- Pages ----
    async function loadPages(){ const pages=await getJSON('/admin/api/generated-pages')||[];
      const tb=$('#pages_table tbody'); tb.innerHTML='';
      pages.forEach(p=>{ const tr=document.createElement('tr');
        const toggle=p.status==='published'?'draft':'published';
        tr.innerHTML='<td>'+(p.title||'')+'</td><td>'+(p.slug||'')+'</td><td>'+p.status+'</td>';
        const td=document.createElement('td');
        const b=document.createElement('button'); b.textContent=(p.status==='published'?'Unpublish':'Publish');
        b.onclick=async()=>{ await send('/admin/api/generated-pages/'+p.id,'PUT',{status:toggle}); loadPages(); };
        const del=document.createElement('button'); del.textContent='Delete';
        del.onclick=async()=>{ await fetch('/admin/api/generated-pages/'+p.id,{method:'DELETE'}); loadPages(); };
        td.appendChild(b); td.appendChild(del); tr.appendChild(td); tb.appendChild(tr); }); }
  </script>
</body>
</html>
