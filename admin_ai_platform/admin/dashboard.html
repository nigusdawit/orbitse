<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Concierge — Admin</title>
  <!--
    M16 admin dashboard SPA. Vanilla JS, no build step (consistent with M2).
    Same-origin: the session cookie authenticates every /admin/api call.

    Architecture: a TABS registry drives the sidebar. "Bespoke" tabs (Admin
    Chat, Cost, KB, Analytics, Voice, Embed Keys) have hand-written render fns.
    "Resource" tabs are generated by renderResource(cfg) — a generic
    list+create+delete+row-actions table — so adding a CRUD surface is a few
    lines of config rather than bespoke HTML. Every endpoint it calls is
    gate-verified; the UI itself is exercised by the M21 browser pass.
  -->
  <style>
    :root { --accent:#c9a96e; --bg:#0a0f1a; --panel:rgba(20,20,24,.78);
            --border:rgba(255,255,255,.12); --text:#e8e8ec; --bad:#e06a6a; --ok:#6ac98a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'DM Sans',system-ui,sans-serif; background:var(--bg);
           color:var(--text); display:flex; min-height:100vh; }
    nav { width:220px; flex:0 0 220px; background:var(--panel); border-right:1px solid var(--border);
          padding:18px 10px; overflow:auto; max-height:100vh; }
    nav h1 { font-family:'Playfair Display',Georgia,serif; font-size:16px; padding:0 8px 12px; }
    nav .grp { font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.45;
               margin:14px 8px 4px; }
    nav button { display:block; width:100%; text-align:left; background:none; border:none;
                 color:var(--text); padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; }
    nav button.active, nav button:hover { background:rgba(255,255,255,.07); }
    nav .logout { margin-top:20px; }
    main { flex:1; padding:24px 28px; overflow:auto; max-height:100vh; }
    h2 { font-family:'Playfair Display',Georgia,serif; color:var(--accent); margin-top:0; }
    .tab { display:none; } .tab.active { display:block; }
    label { display:block; margin:10px 0 4px; font-size:13px; opacity:.8; }
    input, textarea, select { width:100%; padding:9px 11px; border-radius:8px;
      border:1px solid var(--border); background:rgba(255,255,255,.05); color:var(--text); outline:none; }
    textarea { min-height:90px; font-family:inherit; }
    button.act { background:var(--accent); color:#1a1a1a; border:none; border-radius:8px;
                 padding:8px 14px; font-weight:600; cursor:pointer; margin-top:10px; }
    button.mini { background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--border);
                  border-radius:6px; padding:4px 9px; cursor:pointer; font-size:12px; margin:0 4px 0 0; }
    .row { display:flex; gap:16px; flex-wrap:wrap; } .row > div { flex:1; min-width:180px; }
    table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
    td, th { border:1px solid var(--border); padding:6px 9px; text-align:left; vertical-align:top; }
    th { background:rgba(255,255,255,.04); }
    .msg { padding:9px 12px; border-radius:10px; margin:8px 0; max-width:80%; white-space:pre-wrap; }
    .msg.user { background:var(--accent); color:#1a1a1a; margin-left:auto; }
    .msg.assistant { background:rgba(255,255,255,.06); border:1px solid var(--border); }
    .pending { border:1px solid var(--accent); border-radius:10px; padding:10px; margin:8px 0; }
    #chatlog { height:46vh; overflow:auto; border:1px solid var(--border); border-radius:10px;
               padding:12px; margin-bottom:10px; }
    .muted { opacity:.6; font-size:13px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px;
            padding:16px; margin:10px 0; }
    .stat { display:inline-block; min-width:130px; margin:6px 18px 6px 0; }
    .stat b { display:block; font-size:24px; color:var(--accent); }
    details > summary { cursor:pointer; margin:10px 0; font-weight:600; }
    #toast { position:fixed; right:18px; bottom:18px; background:var(--panel); color:var(--text);
             border:1px solid var(--border); border-radius:10px; padding:10px 16px; display:none;
             z-index:9; max-width:340px; }
    #toast.bad { border-color:var(--bad); } #toast.ok { border-color:var(--ok); }
  </style>
</head>
<body>
  <nav>
    <h1>AI Concierge</h1>
    <div id="navlist"></div>
    <div class="logout"><a href="/admin/logout" style="color:#bbb">Log out</a></div>
  </nav>
  <main id="main">
    <!-- Admin Chat (bespoke, kept from M2) -->
    <section class="tab active" id="tab-chat">
      <h2>Admin Chat</h2>
      <p class="muted">Ask about your data, or propose changes (writes need your approval).</p>
      <div id="chatlog"></div>
      <div style="display:flex; gap:8px;">
        <input id="chatinput" placeholder="e.g. how many gallery cards do I have?" />
        <button class="act" style="margin:0" id="chatsend">Send</button>
      </div>
    </section>
    <!-- All other tabs are injected by JS into #main -->
  </main>
  <div id="toast"></div>

  <script nonce="__CSP_NONCE__">
  "use strict";
  const $ = s => document.querySelector(s);

  // CSRF: mutations carry X-CSRF-Token (the server requires it on cookie-authed
  // /admin/api writes — M19). Fetched once on boot from the token endpoint.
  let CSRF = '';
  async function loadCsrf(){
    try { const r = await fetch('/admin/api/csrf-token'); if(r.ok){ CSRF = (await r.json()).csrf_token || ''; } }
    catch(e){ /* dashboard still loads; first mutation will 403 and prompt reload */ }
  }
  function csrfHeaders(extra){
    return Object.assign({'X-CSRF-Token': CSRF}, extra || {});
  }

  // ---- shared fetch wrappers + toast ----
  function toast(msg, kind){ const t=$('#toast'); t.textContent=msg; t.className=kind||'';
    t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 3200); }
  async function getJSON(u){
    try { const r=await fetch(u); if(!r.ok){ toast('GET '+u+' → '+r.status,'bad'); return null; }
          return await r.json(); }
    catch(e){ toast('Network error: '+u,'bad'); return null; } }
  async function send(u, method, body){
    try {
      const r=await fetch(u,{method,headers:csrfHeaders({'Content-Type':'application/json'}),
        body: body!==undefined ? JSON.stringify(body) : undefined});
      const j = await r.json().catch(()=>null);
      if(!r.ok){ toast((j&&j.error)||(method+' '+u+' → '+r.status),'bad'); return null; }
      return j===null ? {} : j;
    } catch(e){ toast('Network error: '+u,'bad'); return null; } }
  const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const fmtCents = c => '$'+((Number(c)||0)/100).toFixed(2);

  // ===================== TAB REGISTRY =====================
  // Bespoke tabs reference a render fn; resource tabs carry a `resource` cfg
  // consumed by renderResource(). Groups order the sidebar.
  const TABS = [
    {id:'chat', label:'Admin Chat', group:'AI', bespoke:true},
    {id:'chatbot', label:'Chatbot', group:'AI', render:renderChatbot},
    {id:'provider', label:'AI Provider', group:'AI', render:renderProvider},
    {id:'history', label:'Chat History', group:'AI', render:renderHistory},
    {id:'pages', label:'Saved Pages', group:'AI', render:renderPages},
    {id:'cost', label:'Cost', group:'AI', render:renderCost},
    {id:'analytics', label:'Analytics', group:'AI', render:renderAnalytics},

    {id:'skills', label:'Skills', group:'Agent', resource:{
      title:'Skills', list:'/admin/api/skills', key:'skills',
      cols:['id','name','display_name','enabled','builtin'],
      toggle:{field:'enabled', put:id=>'/admin/api/skills/'+id},
      create:{post:'/admin/api/skills', fields:[
        {name:'name',label:'name (a-z_)'},{name:'display_name',label:'Display name'},
        {name:'skill_type',label:'Type (sql/http)'},{name:'description',label:'Description',type:'textarea'}]},
      del:id=>'/admin/api/skills/'+id }},
    {id:'mcp', label:'MCP Connectors', group:'Agent', resource:{
      title:'MCP Connectors', list:'/admin/api/mcp/servers', key:'servers',
      cols:['id','name','transport','enabled','tool_count'],
      create:{post:'/admin/api/mcp/servers', fields:[
        {name:'name',label:'Name'},{name:'transport',label:'Transport (http/sse)'},
        {name:'url',label:'URL'}]},
      del:id=>'/admin/api/mcp/servers/'+id,
      actions:[{label:'Test', post:id=>'/admin/api/mcp/servers/'+id+'/test'},
               {label:'Refresh tools', post:id=>'/admin/api/mcp/servers/'+id+'/refresh-tools'}] }},
    {id:'kb', label:'Knowledge Base', group:'Agent', render:renderKB},
    {id:'automations', label:'Automations', group:'Agent', resource:{
      title:'Automations', list:'/admin/api/automations', key:'automations',
      cols:['id','name','trigger_type','action_type','enabled'],
      create:{post:'/admin/api/automations', fields:[
        {name:'name',label:'Name'},{name:'trigger_type',label:'Trigger type'},
        {name:'action_type',label:'Action type'}]},
      del:id=>'/admin/api/automations/'+id,
      actions:[{label:'Test run', post:id=>'/admin/api/automations/'+id+'/test-run'}] }},

    {id:'scraper', label:'Web Scraper', group:'Content', render:renderScraper},
    {id:'presentations', label:'Presentations', group:'Content', resource:{
      title:'Presentations', list:'/admin/api/presentations', key:'presentations',
      cols:['id','slug','title','slide_count','enabled'],
      create:{post:'/admin/api/presentations', fields:[
        {name:'slug',label:'slug'},{name:'title',label:'Title'},
        {name:'description',label:'Description',type:'textarea'}]},
      del:id=>'/admin/api/presentations/'+id }},
    {id:'experiences', label:'Experiences', group:'Content', resource:contentRes(
      'experiences', ['id','name','description','sort_order'],
      [{name:'name',label:'Name'},{name:'description',label:'Description',type:'textarea'},
       {name:'icon',label:'Icon'},{name:'sort_order',label:'Sort',type:'number'}])},
    {id:'faqs', label:'FAQs', group:'Content', resource:contentRes(
      'faqs', ['id','question','answer','sort_order'],
      [{name:'question',label:'Question'},{name:'answer',label:'Answer',type:'textarea'},
       {name:'sort_order',label:'Sort',type:'number'}])},
    {id:'testimonials', label:'Testimonials', group:'Content', resource:contentRes(
      'testimonials', ['id','reviewer_name','rating','content'],
      [{name:'reviewer_name',label:'Reviewer'},{name:'reviewer_role',label:'Role'},
       {name:'content',label:'Content',type:'textarea'},{name:'rating',label:'Rating',type:'number'}])},
    {id:'team', label:'Team', group:'Content', resource:contentRes(
      'team', ['id','name','title','bio'],
      [{name:'name',label:'Name'},{name:'title',label:'Title'},{name:'bio',label:'Bio',type:'textarea'}])},
    {id:'pricing', label:'Pricing', group:'Content', resource:contentRes(
      'pricing-seasons', ['id','label','date_range','price_range'],
      [{name:'label',label:'Label'},{name:'date_range',label:'Date range'},
       {name:'price_range',label:'Price range'}])},
    {id:'blog', label:'Blog', group:'Content', resource:contentRes(
      'blog', ['id','slug','title','status'],
      [{name:'slug',label:'slug'},{name:'title',label:'Title'},{name:'excerpt',label:'Excerpt',type:'textarea'},
       {name:'status',label:'Status (draft/published)'}])},
    {id:'business', label:'Business Info', group:'Content', render:renderBusiness},

    {id:'products', label:'Products', group:'Commerce', resource:{
      title:'Products', list:'/admin/api/products', key:'products',
      cols:['id','slug','name','price_cents','stock','active'],
      fmt:{price_cents:fmtCents},
      create:{post:'/admin/api/products', fields:[
        {name:'slug',label:'slug'},{name:'name',label:'Name'},
        {name:'price_cents',label:'Price (cents)',type:'number'},
        {name:'stock',label:'Stock',type:'number'}]},
      del:id=>'/admin/api/products/'+id,
      actions:[{label:'Sync to Stripe', post:id=>'/admin/api/products/'+id+'/sync'}] }},
    {id:'services', label:'Services', group:'Commerce', resource:{
      title:'Services', list:'/admin/api/services', key:'services',
      cols:['id','slug','name','pricing_model','base_price_cents','is_active'],
      fmt:{base_price_cents:fmtCents},
      create:{post:'/admin/api/services', fields:[
        {name:'slug',label:'slug'},{name:'name',label:'Name'},
        {name:'pricing_model',label:'Pricing (rsvp/deposit/full)'},
        {name:'base_price_cents',label:'Base price (cents)',type:'number'}]},
      del:id=>'/admin/api/services/'+id }},
    {id:'orders', label:'Orders', group:'Commerce', resource:{
      title:'Orders', list:'/admin/api/orders', key:'orders', readonly:true,
      cols:['order_number','status','total_cents','customer_email','created_at'],
      fmt:{total_cents:fmtCents} }},
    {id:'events', label:'Events', group:'Commerce', resource:{
      title:'Events', list:'/admin/api/events', key:'events',
      cols:['id','slug','title','price_mode','capacity','status'],
      create:{post:'/admin/api/events', fields:[
        {name:'slug',label:'slug'},{name:'title',label:'Title'},
        {name:'price_mode',label:'Mode (free/paid/donation)'},
        {name:'price_cents',label:'Price (cents)',type:'number'},
        {name:'capacity',label:'Capacity (0=∞)',type:'number'}]},
      del:id=>'/admin/api/events/'+id }},

    {id:'reviews', label:'Reviews', group:'Marketing', resource:{
      title:'Review Destinations', list:'/admin/api/reviews/destinations', key:'destinations',
      cols:['id','name','kind','total_count','avg_rating'],
      create:{post:'/admin/api/reviews/destinations', fields:[
        {name:'name',label:'Name'},{name:'kind',label:'Kind (google/yelp/tripadvisor/internal)'},
        {name:'external_id',label:'External/place id'},{name:'url',label:'Review URL'}]},
      del:id=>'/admin/api/reviews/destinations/'+id,
      actions:[{label:'Refresh', post:id=>'/admin/api/reviews/destinations/'+id+'/refresh'}] }},
    {id:'subscribers', label:'Subscribers', group:'Marketing', resource:{
      title:'Subscribers', list:'/admin/api/messaging/subscribers', key:'subscribers',
      cols:['id','email','phone','full_name','opt_in'],
      create:{post:'/admin/api/messaging/subscribers', fields:[
        {name:'email',label:'Email'},{name:'phone',label:'Phone'},{name:'full_name',label:'Name'}]},
      del:id=>'/admin/api/messaging/subscribers/'+id }},
    {id:'templates', label:'Templates', group:'Marketing', resource:{
      title:'Message Templates', list:'/admin/api/messaging/templates', key:'templates',
      cols:['id','name','channel','subject'],
      create:{post:'/admin/api/messaging/templates', fields:[
        {name:'name',label:'Name'},{name:'channel',label:'Channel (email/sms)'},
        {name:'subject',label:'Subject'},{name:'body',label:'Body',type:'textarea'}]},
      del:id=>'/admin/api/messaging/templates/'+id }},
    {id:'campaigns', label:'Campaigns', group:'Marketing', resource:{
      title:'Campaigns', list:'/admin/api/messaging/campaigns', key:'campaigns',
      cols:['id','name','channel','status','sent_count'],
      create:{post:'/admin/api/messaging/campaigns', fields:[
        {name:'name',label:'Name'},{name:'channel',label:'Channel (email/sms)'},
        {name:'subject_snapshot',label:'Subject'},{name:'body_snapshot',label:'Body',type:'textarea'}]},
      del:id=>'/admin/api/messaging/campaigns/'+id,
      actions:[{label:'Send now', post:id=>'/admin/api/messaging/campaigns/'+id+'/send-now'}] }},

    {id:'voice', label:'Voice', group:'Settings', render:renderVoice},
    {id:'embedkeys', label:'Embed Keys', group:'Settings', render:renderEmbedKeys},
    {id:'plans', label:'Plans & Features', group:'Settings', render:renderPlans},
    {id:'secrets', label:'Secrets', group:'Settings', render:renderSecrets},
    {id:'devconsole', label:'Developer Console', group:'Settings', render:renderDevConsole},
  ];

  function contentRes(resource, cols, fields){
    return { title:resource, list:'/admin/api/content/'+resource, key:'items', cols:cols,
             create:{post:'/admin/api/content/'+resource, fields:fields},
             del:id=>'/admin/api/content/'+resource+'/'+id };
  }

  // ===================== NAV + ROUTING =====================
  function buildNav(){
    const groups = {};
    TABS.forEach(t => { (groups[t.group] = groups[t.group] || []).push(t); });
    const nav = $('#navlist'); nav.innerHTML='';
    Object.keys(groups).forEach(g => {
      const h=document.createElement('div'); h.className='grp'; h.textContent=g; nav.appendChild(h);
      groups[g].forEach(t => {
        const b=document.createElement('button'); b.dataset.tab=t.id; b.textContent=t.label;
        if(t.id==='chat') b.classList.add('active');
        b.onclick=()=>activate(t.id); nav.appendChild(b);
      });
    });
  }
  function sectionEl(id){
    let el=$('#tab-'+id);
    if(!el){ el=document.createElement('section'); el.className='tab'; el.id='tab-'+id; $('#main').appendChild(el); }
    return el;
  }
  function activate(id){
    document.querySelectorAll('nav button[data-tab]').forEach(x=>x.classList.toggle('active', x.dataset.tab===id));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    const t = TABS.find(x=>x.id===id); const el = sectionEl(id); el.classList.add('active');
    if(t.bespoke) return;                    // already in static HTML
    if(t.resource) renderResource(el, t.resource);
    else if(t.render) t.render(el);
  }

  // ===================== GENERIC RESOURCE TAB =====================
  async function renderResource(el, cfg){
    el.innerHTML = '<h2>'+esc(cfg.title)+'</h2><div class="muted">Loading…</div>';
    const data = await getJSON(cfg.list); const rows = (data && data[cfg.key]) || [];
    let html = '<h2>'+esc(cfg.title)+'</h2>';
    // create form
    if(cfg.create){
      html += '<details><summary>+ New</summary><div class="card" id="cr-'+cfg.key+'">';
      cfg.create.fields.forEach(f=>{
        html += '<label>'+esc(f.label||f.name)+'</label>';
        html += f.type==='textarea' ? '<textarea data-f="'+f.name+'"></textarea>'
              : '<input data-f="'+f.name+'" type="'+(f.type||'text')+'">';
      });
      html += '<button class="act" data-create>Create</button></div></details>';
    }
    // table
    const cols = cfg.cols;
    html += '<table><thead><tr>' + cols.map(c=>'<th>'+esc(c)+'</th>').join('') +
            '<th></th></tr></thead><tbody>';
    rows.forEach(r=>{
      html += '<tr>' + cols.map(c=>{
        let v = r[c]; if(cfg.fmt && cfg.fmt[c]) v = cfg.fmt[c](v);
        return '<td>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</td>';
      }).join('');
      html += '<td>';
      if(cfg.toggle){ html += '<button class="mini" data-toggle="'+r.id+'" data-cur="'+(r[cfg.toggle.field]?1:0)+'">'
                        + (r[cfg.toggle.field]?'Disable':'Enable') + '</button>'; }
      (cfg.actions||[]).forEach((a,i)=>{ html += '<button class="mini" data-action="'+i+'" data-id="'+r.id+'">'+esc(a.label)+'</button>'; });
      if(cfg.del && !cfg.readonly){ html += '<button class="mini" data-del="'+r.id+'">Delete</button>'; }
      html += '</td></tr>';
    });
    html += '</tbody></table>';
    if(!rows.length) html += '<p class="muted">No rows yet.</p>';
    el.innerHTML = html;

    // wire create
    const crBtn = el.querySelector('[data-create]');
    if(crBtn) crBtn.onclick = async ()=>{
      const body={}; el.querySelectorAll('[data-f]').forEach(i=>{ if(i.value!=='') body[i.dataset.f]=i.value; });
      const res = await send(cfg.create.post, 'POST', body);
      if(res){ toast('Created','ok'); renderResource(el, cfg); }
    };
    // wire toggle
    el.querySelectorAll('[data-toggle]').forEach(b=> b.onclick = async ()=>{
      const id=b.dataset.toggle, cur=b.dataset.cur==='1';
      const body={}; body[cfg.toggle.field]=!cur;
      const res = await send(cfg.toggle.put(id), 'PUT', body);
      if(res){ renderResource(el, cfg); }
    });
    // wire row actions
    el.querySelectorAll('[data-action]').forEach(b=> b.onclick = async ()=>{
      const a=cfg.actions[+b.dataset.action];
      const res = await send(a.post(b.dataset.id), 'POST', {});
      if(res){ toast(a.label+': '+(res.error||'ok'), res.error?'bad':'ok'); renderResource(el, cfg); }
    });
    // wire delete
    el.querySelectorAll('[data-del]').forEach(b=> b.onclick = async ()=>{
      if(!confirm('Delete #'+b.dataset.del+'?')) return;
      const res = await send(cfg.del(b.dataset.del), 'DELETE');
      if(res){ toast('Deleted','ok'); renderResource(el, cfg); }
    });
  }

  // ===================== BESPOKE TABS =====================
  // ---- Admin chat (SSE, kept from M2) ----
  const SESSION = 'admin_' + Math.random().toString(36).slice(2);
  function addMsg(role, text){ const d=document.createElement('div'); d.className='msg '+role;
    d.textContent=text; $('#chatlog').appendChild(d); $('#chatlog').scrollTop=1e9; return d; }
  function addPending(actionId, preview){
    const d=document.createElement('div'); d.className='pending';
    d.innerHTML='<div>'+esc(preview)+'</div>';
    const ap=document.createElement('button'); ap.className='act'; ap.textContent='Approve';
    const rj=document.createElement('button'); rj.className='mini'; rj.textContent='Reject';
    ap.onclick=async()=>{ await send('/admin/api/chat/action/'+actionId+'/approve','POST',{}); d.innerHTML='<span class="muted">Approved.</span>'; };
    rj.onclick=async()=>{ await send('/admin/api/chat/action/'+actionId+'/reject','POST',{}); d.innerHTML='<span class="muted">Rejected.</span>'; };
    d.appendChild(ap); d.appendChild(rj); $('#chatlog').appendChild(d); $('#chatlog').scrollTop=1e9;
  }
  async function sendChat(){
    const text=$('#chatinput').value.trim(); if(!text) return;
    $('#chatinput').value=''; addMsg('user', text); const bubble=addMsg('assistant','');
    let resp; try { resp=await fetch('/admin/api/chat/stream',{method:'POST',
      headers:csrfHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({message:text, session_id:SESSION})}); }
    catch(e){ bubble.textContent='Network error'; return; }
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='', acc='';
    while(true){ const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){ if(line.indexOf('data:')!==0) continue;
        let ev; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
        if(ev.type==='token'){ acc+=ev.content; bubble.textContent=acc; $('#chatlog').scrollTop=1e9; }
        else if(ev.type==='text'){ acc=ev.content; bubble.textContent=acc; }
        else if(ev.type==='pending_action'){ addPending(ev.action_id, ev.preview); }
        else if(ev.type==='error'){ bubble.textContent=ev.content; } } }
  }
  document.addEventListener('keydown', e=>{ if(e.key==='Enter' && document.activeElement===$('#chatinput')) sendChat(); });
  document.getElementById('chatsend').addEventListener('click', sendChat);

  // ---- Chatbot ----
  async function renderChatbot(el){
    el.innerHTML = `<h2>Chatbot</h2>
      <div class="row"><div><label>Agent name</label><input id="cb_name"></div>
      <div><label>Agent role</label><input id="cb_role"></div></div>
      <label>Greeting</label><input id="cb_greeting">
      <label><input type="checkbox" id="cb_enabled" style="width:auto"> Enabled on site</label>
      <label>System prompt (blank = built-in default)</label><textarea id="cb_prompt"></textarea>
      <button class="act" id="cb_save">Save</button>`;
    const s=await getJSON('/admin/api/chatbot-settings')||{};
    $('#cb_name').value=s.agent_name||''; $('#cb_role').value=s.agent_role||'';
    $('#cb_greeting').value=s.greeting||''; $('#cb_enabled').checked=!!s.enabled;
    $('#cb_prompt').value=s.system_prompt||'';
    $('#cb_save').onclick=async()=>{ const r=await send('/admin/api/chatbot-settings','PUT',{
      agent_name:$('#cb_name').value, agent_role:$('#cb_role').value, greeting:$('#cb_greeting').value,
      enabled:$('#cb_enabled').checked, system_prompt:$('#cb_prompt').value, mode:'builtin'});
      if(r) toast('Saved','ok'); };
  }
  // ---- Provider ----
  async function renderProvider(el){
    el.innerHTML = `<h2>AI Provider</h2><div class="row">
      <div><label>Provider</label><select id="pv_provider"><option value="openai">OpenAI</option>
      <option value="claude">Claude</option></select></div>
      <div><label>OpenAI model</label><input id="pv_openai"></div>
      <div><label>Claude model</label><input id="pv_claude"></div></div>
      <button class="act" id="pv_save">Save</button>`;
    const p=await getJSON('/admin/api/llm-provider')||{};
    $('#pv_provider').value=p.provider||'openai'; $('#pv_openai').value=p.openai_model||'';
    $('#pv_claude').value=p.claude_model||'';
    $('#pv_save').onclick=async()=>{ const r=await send('/admin/api/llm-provider','PUT',{
      provider:$('#pv_provider').value, openai_model:$('#pv_openai').value, claude_model:$('#pv_claude').value});
      if(r) toast('Saved','ok'); };
  }
  // ---- History ----
  async function renderHistory(el){
    el.innerHTML='<h2>Chat History</h2><div id="hs" class="muted"></div><table id="ht"><thead><tr>'+
      '<th>When</th><th>Messages</th><th>First message</th></tr></thead><tbody></tbody></table>';
    const d=await getJSON('/admin/api/chat-history')||{conversations:[],stats:{}};
    $('#hs').textContent=(d.stats.total_conversations||0)+' conversations · '+
      (d.stats.messages_today||0)+' today · '+(d.stats.unique_visitors||0)+' visitors';
    const tb=el.querySelector('#ht tbody');
    (d.conversations||[]).forEach(c=>{ const tr=document.createElement('tr');
      tr.innerHTML='<td>'+esc(c.updated_at)+'</td><td>'+esc(c.message_count||0)+'</td><td>'+
        esc((c.first_message||'').slice(0,80))+'</td>'; tb.appendChild(tr); });
  }
  // ---- Pages ----
  async function renderPages(el){
    el.innerHTML='<h2>Saved Pages</h2><table id="pt"><thead><tr><th>Title</th><th>Slug</th>'+
      '<th>Status</th><th></th></tr></thead><tbody></tbody></table>';
    const pages=await getJSON('/admin/api/generated-pages')||[];
    const tb=el.querySelector('#pt tbody');
    pages.forEach(p=>{ const tr=document.createElement('tr');
      tr.innerHTML='<td>'+esc(p.title)+'</td><td>'+esc(p.slug)+'</td><td>'+esc(p.status)+'</td>';
      const td=document.createElement('td');
      const b=document.createElement('button'); b.className='mini';
      b.textContent=p.status==='published'?'Unpublish':'Publish';
      b.onclick=async()=>{ await send('/admin/api/generated-pages/'+p.id,'PUT',
        {status:p.status==='published'?'draft':'published'}); renderPages(el); };
      const del=document.createElement('button'); del.className='mini'; del.textContent='Delete';
      del.onclick=async()=>{ await send('/admin/api/generated-pages/'+p.id,'DELETE'); renderPages(el); };
      td.appendChild(b); td.appendChild(del); tr.appendChild(td); tb.appendChild(tr); });
  }
  // ---- Cost ----
  async function renderCost(el){
    el.innerHTML='<h2>Cost</h2><div id="cost_sum" class="card"></div>'+
      '<h3>Prices</h3><table id="cost_p"><thead><tr><th>Provider</th><th>Model</th>'+
      '<th>In/1k</th><th>Out/1k</th></tr></thead><tbody></tbody></table>';
    const s=await getJSON('/admin/api/cost/summary')||{};
    const mtd=s.mtd||{};
    $('#cost_sum').innerHTML='<span class="stat"><b>'+ '$'+(Number(mtd.total_usd)||0).toFixed(2)+
      '</b>MTD spend</span><span class="stat"><b>'+ (s.percent_of_cap!=null?s.percent_of_cap+'%':'—')+
      '</b>of cap</span><span class="stat"><b>$'+(Number(mtd.chat_usd)||0).toFixed(2)+'</b>chat</span>'+
      '<span class="stat"><b>$'+(Number(mtd.voice_usd)||0).toFixed(2)+'</b>voice</span>';
    const pr=await getJSON('/admin/api/cost/prices')||{prices:[]};
    const tb=el.querySelector('#cost_p tbody');
    (pr.prices||[]).forEach(p=>{ const tr=document.createElement('tr');
      tr.innerHTML='<td>'+esc(p.provider)+'</td><td>'+esc(p.model)+'</td><td>'+
        esc(p.input_per_1k ?? p.prompt_per_1k)+'</td><td>'+esc(p.output_per_1k ?? p.completion_per_1k)+'</td>';
      tb.appendChild(tr); });
  }
  // ---- Analytics ----
  async function renderAnalytics(el){
    el.innerHTML='<h2>Analytics (30d)</h2><div id="an_sum" class="card"></div>'+
      '<div class="row"><div><h3>Top pages</h3><div id="an_pages"></div></div>'+
      '<div><h3>Tool usage</h3><div id="an_tools"></div></div></div>';
    const a=await getJSON('/admin/api/analytics?days=30')||{totals:{}};
    const t=a.totals||{};
    $('#an_sum').innerHTML='<span class="stat"><b>'+(t.views||0)+'</b>views</span>'+
      '<span class="stat"><b>'+(t.sessions||0)+'</b>sessions</span>'+
      '<span class="stat"><b>'+(t.visitors||0)+'</b>visitors</span>'+
      '<span class="stat"><b>'+Math.round((t.avg_duration_ms||0)/1000)+'s</b>avg dwell</span>';
    $('#an_pages').innerHTML=(a.top_pages||[]).map(p=>'<div>'+esc(p.value)+' — '+p.n+'</div>').join('')||'<span class="muted">—</span>';
    const ch=await getJSON('/admin/api/analytics/chat')||{tool_usage:[]};
    $('#an_tools').innerHTML=(ch.tool_usage||[]).map(p=>'<div>'+esc(p.tool)+' — '+p.n+'</div>').join('')||'<span class="muted">—</span>';
  }
  // ---- Knowledge Base ----
  async function renderKB(el){
    el.innerHTML='<h2>Knowledge Base</h2><div class="card"><label>Upload a document</label>'+
      '<input type="file" id="kb_file"><button class="act" id="kb_up">Upload</button></div>'+
      '<table id="kb_t"><thead><tr><th>ID</th><th>File</th><th>Status</th><th>Chunks</th><th></th></tr></thead><tbody></tbody></table>';
    const d=await getJSON('/admin/api/kb/list');
    const tb=el.querySelector('#kb_t tbody');
    if(!d){ el.querySelector('#kb_t').insertAdjacentHTML('afterend','<p class="muted">KB unavailable (pgvector off).</p>'); }
    ((d&&d.documents)||[]).forEach(doc=>{ const tr=document.createElement('tr');
      tr.innerHTML='<td>'+esc(doc.id)+'</td><td>'+esc(doc.filename)+'</td><td>'+esc(doc.status)+
        '</td><td>'+esc(doc.chunk_count ?? '')+'</td>';
      const td=document.createElement('td'); const del=document.createElement('button');
      del.className='mini'; del.textContent='Delete';
      del.onclick=async()=>{ await send('/admin/api/kb/'+doc.id,'DELETE'); renderKB(el); };
      td.appendChild(del); tr.appendChild(td); tb.appendChild(tr); });
    $('#kb_up').onclick=async()=>{ const f=$('#kb_file').files[0]; if(!f){ toast('Pick a file','bad'); return; }
      const fd=new FormData(); fd.append('file', f);
      const r=await fetch('/admin/api/kb/upload',{method:'POST',headers:csrfHeaders(),body:fd});
      if(r.ok){ toast('Uploaded','ok'); renderKB(el); } else { toast('Upload failed','bad'); } };
  }
  // ---- Scraper ----
  async function renderScraper(el){
    el.innerHTML='<h2>Web Scraper</h2><div class="card"><label>One-off job URL</label>'+
      '<input id="sc_url" placeholder="https://…"><button class="act" id="sc_run">Run</button></div>'+
      '<table id="sc_t"><thead><tr><th>ID</th><th>URL/objective</th><th>Status</th></tr></thead><tbody></tbody></table>';
    const d=await getJSON('/admin/api/scrape-jobs')||{jobs:[]};
    const tb=el.querySelector('#sc_t tbody');
    (d.jobs||[]).forEach(j=>{ const tr=document.createElement('tr');
      tr.innerHTML='<td>'+esc(j.id)+'</td><td>'+esc(j.url||j.objective)+'</td><td>'+esc(j.status)+'</td>';
      tb.appendChild(tr); });
    $('#sc_run').onclick=async()=>{ const r=await send('/admin/api/scrape-jobs','POST',
      {input_mode:'url', url:$('#sc_url').value}); if(r){ toast('Queued','ok'); renderScraper(el); } };
  }
  // ---- Voice ----
  async function renderVoice(el){
    el.innerHTML='<h2>Voice</h2><div class="row">'+
      '<div><label>TTS provider</label><select id="v_prov"><option value="openai">OpenAI</option>'+
      '<option value="elevenlabs">ElevenLabs</option></select></div>'+
      '<div><label>Default voice</label><input id="v_voice"></div></div>'+
      '<label><input type="checkbox" id="v_ai" style="width:auto"> AI voice enabled</label>'+
      '<label><input type="checkbox" id="v_visitor" style="width:auto"> Visitor voice enabled</label>'+
      '<button class="act" id="v_save">Save</button>';
    const s=await getJSON('/admin/api/voice/settings')||{};
    $('#v_prov').value=s.tts_provider||'openai'; $('#v_voice').value=s.default_voice||'alloy';
    $('#v_ai').checked=!!s.enabled_ai_voice; $('#v_visitor').checked=!!s.enabled_visitor_voice;
    $('#v_save').onclick=async()=>{ const r=await send('/admin/api/voice/settings','PUT',{
      tts_provider:$('#v_prov').value, default_voice:$('#v_voice').value,
      enabled_ai_voice:$('#v_ai').checked, enabled_visitor_voice:$('#v_visitor').checked});
      if(r) toast('Saved','ok'); };
  }
  // ---- Embed Keys (with allowlist editor) ----
  async function renderEmbedKeys(el){
    el.innerHTML='<h2>Embed Keys</h2><div class="card"><label>Label</label><input id="ek_label">'+
      '<button class="act" id="ek_new">Create key</button></div>'+
      '<table id="ek_t"><thead><tr><th>Key</th><th>Label</th><th>Allowlist</th><th>Enabled</th><th></th>'+
      '</tr></thead><tbody></tbody></table>';
    const d=await getJSON('/admin/api/embed-keys')||{keys:[]};
    const tb=el.querySelector('#ek_t tbody');
    (d.keys||[]).forEach(k=>{ const tr=document.createElement('tr');
      const allow=Array.isArray(k.origin_allowlist)?k.origin_allowlist.join(', '):(k.origin_allowlist||'');
      tr.innerHTML='<td><code>'+esc(k.embed_key)+'</code></td><td>'+esc(k.label)+'</td>';
      const td1=document.createElement('td'); const inp=document.createElement('input');
      inp.value=allow; inp.style.minWidth='180px'; td1.appendChild(inp); tr.appendChild(td1);
      tr.insertAdjacentHTML('beforeend','<td>'+(k.enabled?'yes':'no')+'</td>');
      const td2=document.createElement('td');
      const save=document.createElement('button'); save.className='mini'; save.textContent='Save allowlist';
      save.onclick=async()=>{ const list=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
        const r=await send('/admin/api/embed-keys/'+k.id,'PUT',{origin_allowlist:list});
        if(r) toast('Saved','ok'); };
      const del=document.createElement('button'); del.className='mini'; del.textContent='Delete';
      del.onclick=async()=>{ await send('/admin/api/embed-keys/'+k.id,'DELETE'); renderEmbedKeys(el); };
      td2.appendChild(save); td2.appendChild(del); tr.appendChild(td2); tb.appendChild(tr); });
    $('#ek_new').onclick=async()=>{ const r=await send('/admin/api/embed-keys','POST',
      {label:$('#ek_label').value, origin_allowlist:[]}); if(r){ toast('Created','ok'); renderEmbedKeys(el); } };
  }
  // ---- Plans & Features ----
  async function renderPlans(el){
    el.innerHTML='<h2>Plans & Features</h2><div id="pf"></div>';
    const d=await getJSON('/admin/api/plans-features')||{features:[]};
    $('#pf').innerHTML='<p class="muted">Deploy: '+esc(d.deploy_mode)+' · Admin: '+esc(d.admin_mode||'')+'</p>'+
      '<table><thead><tr><th>Feature</th><th>Enabled</th></tr></thead><tbody>'+
      (d.features||[]).map(f=>'<tr><td>'+esc(f.name||f)+'</td><td>'+(f.enabled?'yes':(f.enabled===false?'no':''))+'</td></tr>').join('')+
      '</tbody></table>';
  }
  // ---- Business info ----
  async function renderBusiness(el){
    el.innerHTML='<h2>Business Info</h2><div class="row">'+
      '<div><label>Name</label><input id="bi_name"></div><div><label>Phone</label><input id="bi_phone"></div></div>'+
      '<label>Tagline</label><input id="bi_tag"><label>About</label><textarea id="bi_about"></textarea>'+
      '<div class="row"><div><label>Email</label><input id="bi_email"></div>'+
      '<div><label>Address</label><input id="bi_addr"></div></div><button class="act" id="bi_save">Save</button>';
    const b=await getJSON('/admin/api/content/business-info')||{};
    $('#bi_name').value=b.name||''; $('#bi_phone').value=b.phone||''; $('#bi_tag').value=b.tagline||'';
    $('#bi_about').value=b.about||''; $('#bi_email').value=b.email||''; $('#bi_addr').value=b.address||'';
    $('#bi_save').onclick=async()=>{ const r=await send('/admin/api/content/business-info','PUT',{
      name:$('#bi_name').value, phone:$('#bi_phone').value, tagline:$('#bi_tag').value,
      about:$('#bi_about').value, email:$('#bi_email').value, address:$('#bi_addr').value});
      if(r) toast('Saved','ok'); };
  }
  // ---- Secrets ----
  async function renderSecrets(el){
    el.innerHTML='<h2>Secrets</h2><p class="muted">Presence only — values are never shown.</p><div id="sec"></div>';
    const d=await getJSON('/admin/api/secrets')||{};
    const items = d.secrets || d.summary || d;
    $('#sec').innerHTML='<table><thead><tr><th>Key</th><th>Set?</th></tr></thead><tbody>'+
      Object.keys(items||{}).map(k=>'<tr><td>'+esc(k)+'</td><td>'+(items[k]?'yes':'no')+'</td></tr>').join('')+
      '</tbody></table>';
  }

  // ---- Developer Console ----
  async function renderDevConsole(el){
    el.innerHTML='<h2>Developer Console</h2><div id="dc"></div>';
    const d=await getJSON('/admin/api/devconsole/overview')||{};
    const counts=d.counts||{}; const cfg=d.config||{};
    $('#dc').innerHTML='<h3>Row counts</h3><table><tbody>'+
      Object.keys(counts).map(k=>'<tr><td>'+esc(k)+'</td><td>'+esc(counts[k])+'</td></tr>').join('')+
      '</tbody></table><h3>Config</h3><table><tbody>'+
      Object.keys(cfg).map(k=>'<tr><td>'+esc(k)+'</td><td>'+esc(typeof cfg[k]==='boolean'?(cfg[k]?'yes':'no'):cfg[k])+'</td></tr>').join('')+
      '</tbody></table>';
  }

  // ===================== BOOT =====================
  buildNav();
  loadCsrf();
  </script>
</body>
</html>
