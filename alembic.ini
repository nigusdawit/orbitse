; Alembic configuration for the project.
;
; The DATABASE_URL is NOT read from this file — env.py pulls it from the
; environment so the running app, the smoke suite, and any one-shot
; migration command all hit the same database without a config-drift
; surface. The placeholder url below exists only because Alembic's
; config parser requires the key to be present.

[alembic]
script_location = migrations
sqlalchemy.url = postgresql+psycopg2://placeholder/placeholder
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
truncate_slug_length = 40
revision_environment = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
