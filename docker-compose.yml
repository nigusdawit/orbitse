# =============================================================================
# admin_ai_platform — local one-command spin-up (M20)
# =============================================================================
# Usage:
#   1. cp .env.example .env   and fill in the keys you want
#   2. docker compose up --build
#   3. Open http://localhost:5000  (admin: /admin, first run: /setup)
#
# Brings up the app + a pgvector-enabled Postgres + an optional Redis (shared
# rate-limit / cache). For production, point DATABASE_URL at a managed Postgres
# (with the `vector` extension available) and drop the `db` service.
# =============================================================================

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Override DATABASE_URL to the sidecar; everything else comes from .env.
      DATABASE_URL: postgresql://aiconcierge:aiconcierge@db:5432/aiconcierge
      # Use the bundled Redis for shared rate limiting (comment out to fall back
      # to the Postgres-backed limiter instead).
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  db:
    # pgvector image so the RAG/knowledge-base feature works out of the box.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiconcierge
      POSTGRES_PASSWORD: aiconcierge
      POSTGRES_DB: aiconcierge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiconcierge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      # Non-default host port for direct psql access. Comment out if you don't
      # want the DB reachable from the host.
      - "55432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
