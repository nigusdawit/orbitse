<!DOCTYPE html>
<!-- Admin invite acceptance (RBAC §6.3). Token-gated, no session: the invitee sets their
     password here, which activates their admin_users row. POSTs to /admin/api/join. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Set your password</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900&display=swap">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:#060b14; color:#e4e4e7; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:rgba(255,255,255,0.04); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.1); border-radius:1rem; padding:2.5rem; width:100%; max-width:380px; box-shadow:0 25px 60px rgba(0,0,0,0.4); }
    h1 { font-family:'Playfair Display',serif; font-size:1.5rem; margin-bottom:0.5rem; color:#fff; }
    p { color:rgba(255,255,255,0.45); font-size:0.875rem; margin-bottom:1.5rem; }
    .form-group { margin-bottom:1rem; }
    label { display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:rgba(255,255,255,0.45); margin-bottom:0.5rem; }
    input { width:100%; padding:0.625rem 0.875rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:0.5rem; color:#e4e4e7; font-size:16px; font-family:inherit; outline:none; }
    input:focus { border-color:rgba(255,255,255,0.35); background:rgba(255,255,255,0.08); }
    input:disabled { opacity:0.6; }
    .btn { width:100%; padding:0.625rem; background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:0.5rem; font-size:0.875rem; font-weight:600; cursor:pointer; font-family:inherit; }
    .btn:hover { background:rgba(255,255,255,0.2); }
    .msg { font-size:0.8125rem; margin-bottom:1rem; padding:0.5rem 0.75rem; border-radius:0.375rem; }
    .msg.err { color:#fca5a5; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.2); }
    .msg.ok { color:#86efac; background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.2); }
    a { color:#93c5fd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set your password</h1>
    {% if not valid %}
      <div class="msg err">This invite link is invalid or has expired. Ask your admin to send a new one.</div>
      <p><a href="/admin/login">Go to login</a></p>
    {% else %}
      <p>You're activating the account for <strong>{{ email }}</strong>. Choose a password (at least {{ min_len }} characters).</p>
      <div id="msg"></div>
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" autofocus placeholder="At least {{ min_len }} characters">
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" placeholder="Re-enter password">
      </div>
      <button class="btn" id="submitBtn" onclick="submitJoin()">Set password &amp; sign in</button>
      <script>
        var TOKEN = {{ token | tojson }};
        var MIN = {{ min_len | tojson }};
        function show(kind, text) {
          document.getElementById('msg').innerHTML = '<div class="msg ' + kind + '">' + text + '</div>';
        }
        async function submitJoin() {
          var pw = document.getElementById('password').value;
          var cf = document.getElementById('confirm').value;
          if (pw.length < MIN) { show('err', 'Password must be at least ' + MIN + ' characters.'); return; }
          if (pw !== cf) { show('err', 'Passwords do not match.'); return; }
          var btn = document.getElementById('submitBtn'); btn.disabled = true;
          try {
            var res = await fetch('/admin/api/join', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: TOKEN, password: pw })
            });
            var d = await res.json().catch(function(){ return {}; });
            if (res.ok && d.success) {
              show('ok', 'Password set! Redirecting to login…');
              setTimeout(function(){ window.location.href = '/admin/login'; }, 1200);
            } else {
              btn.disabled = false;
              show('err', (d && d.message) || 'Could not set your password.');
            }
          } catch (e) { btn.disabled = false; show('err', 'Could not set your password.'); }
        }
      </script>
    {% endif %}
  </div>
</body>
</html>
