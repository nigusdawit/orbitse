<!DOCTYPE html>
<!--
===============================================================================
ADMIN LOGIN PAGE
===============================================================================
Simple password login for the admin dashboard.
The password is set via the ADMIN_PASSWORD environment variable.
Default for development: "admin"
===============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget=resizes-content keeps inputs above the mobile keyboard -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Admin Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #060b14;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -30%;
      right: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(139,92,246,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative;
      z-index: 1;
    }
    .login-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .login-card p {
      color: rgba(255,255,255,0.45);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.45);
      margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0.5rem;
      color: #e4e4e7;
      font-size: 16px; /* 16px prevents iOS Safari auto-zoom on focus */
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-group input:focus {
      border-color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
    }
    .error {
      color: #fca5a5;
      font-size: 0.8125rem;
      margin-bottom: 1rem;
      padding: 0.5rem 0.75rem;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 0.375rem;
      backdrop-filter: blur(8px);
    }
    .btn-login {
      width: 100%;
      padding: 0.625rem;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      font-family: inherit;
      backdrop-filter: blur(8px);
    }
    .btn-login:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Admin Dashboard</h1>
    <p>Enter your password to continue.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autofocus placeholder="Enter admin password">
      </div>
      <button type="submit" class="btn-login">Log In</button>
    </form>
  </div>
</body>
</html>
